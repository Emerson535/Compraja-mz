<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CompraJá MZ</title><style>
body{font-family:Arial;margin:0;background:#f4f6f8;color:#17221d}header{background:#086b4f;color:#fff;padding:15px 5%;display:flex;gap:15px;align-items:center;position:sticky;top:0;z-index:5}.logo{font-size:25px;font-weight:800;margin-right:auto}.logo b{color:#ffd34d}.wrap{max-width:1200px;margin:auto;padding:20px}.hero{background:#086b4f;color:#fff;padding:45px 5%}.hero h1{font-size:40px;margin:0 0 10px}.search{display:flex;max-width:800px;background:#fff;padding:6px;border-radius:10px}.search input{flex:1;border:0;padding:13px;outline:0}.btn{border:0;border-radius:8px;padding:11px 15px;font-weight:bold;cursor:pointer}.primary{background:#086b4f;color:white}.yellow{background:#ffd34d}.white{background:#fff;color:#086b4f}.cats{display:flex;gap:8px;overflow:auto}.cats button{white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.card{background:#fff;border:1px solid #e2e6e9;border-radius:12px;overflow:hidden}.img{height:170px;background:#e7ebed;display:flex;align-items:center;justify-content:center;font-size:50px}.img img{width:100%;height:100%;object-fit:cover}.pad{padding:14px}.price{font-size:20px;font-weight:800;color:#086b4f}.muted{color:#69747d;font-size:13px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.show{display:flex}.box{background:#fff;border-radius:14px;padding:22px;max-width:600px;width:100%;max-height:90vh;overflow:auto}.box input,.box textarea,.box select{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #d5dadd;border-radius:8px;box-sizing:border-box}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.hero h1{font-size:30px}.row{grid-template-columns:1fr}}
</style></head><body>
<header><div class="logo">Compra<b>Já</b> MZ</div><button class="btn white" onclick="openAuth()">Entrar / Criar conta</button><button class="btn yellow" onclick="openSell()">+ Vender</button></header>
<section class="hero"><div class="wrap"><h1>Compre e venda em Moçambique.</h1><p>Livros, roupa, eletrónicos, móveis, carros e muito mais.</p><div class="search"><input id="q" placeholder="Pesquisar produtos..." oninput="load()"><button class="btn yellow" onclick="load()">Pesquisar</button></div></div></section>
<main class="wrap"><h2>Categorias</h2><div class="cats" id="cats"></div><h2 id="heading">Anúncios</h2><div class="grid" id="grid"></div></main>
<div class="modal" id="auth"><div class="box"><button onclick="closeAll()">✕</button><h2 id="authTitle">Entrar</h2><form id="authForm"><input id="name" placeholder="Nome" style="display:none"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Palavra-passe" required><input id="phone" placeholder="Telefone" style="display:none"><input id="location" placeholder="Localização" style="display:none"><button class="btn primary" style="width:100%">Continuar</button></form><p><button class="btn" onclick="toggleAuth()">Criar conta / Entrar</button></p><div id="authMsg"></div></div></div>
<div class="modal" id="sell"><div class="box"><button onclick="closeAll()">✕</button><h2>Publicar anúncio</h2><form id="sellForm" enctype="multipart/form-data"><input name="title" placeholder="Nome do produto" required><div class="row"><input name="price" type="number" placeholder="Preço em MT" required><select name="category" id="catSelect" required></select></div><input name="location" placeholder="Localização" required><textarea name="description" placeholder="Descrição" required></textarea><input name="image" type="file" accept="image/*"><button class="btn primary" style="width:100%">Publicar</button></form><div id="sellMsg"></div></div></div>
<script>
let token=localStorage.token||"",category="";const cats=["Livros","Roupas","Eletrónicos","Casa","Móveis","Automóveis","Telemóveis","Desporto","Outros"];
const money=n=>new Intl.NumberFormat("pt-MZ").format(n)+" MT";
async function api(url,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:"Bearer "+token}:{})};let r=await fetch(url,opt),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Erro");return d}
function openAuth(){document.getElementById("auth").classList.add("show")}function openSell(){if(!token)return openAuth();document.getElementById("sell").classList.add("show")}function closeAll(){document.querySelectorAll(".modal").forEach(x=>x.classList.remove("show"))}
function toggleAuth(){let reg=document.getElementById("name").style.display==="none";document.getElementById("name").style.display=reg?"block":"none";document.getElementById("phone").style.display=reg?"block":"none";document.getElementById("location").style.display=reg?"block":"none";document.getElementById("authTitle").textContent=reg?"Criar conta":"Entrar"}
document.getElementById("cats").innerHTML='<button class="btn" onclick="category=\'\';load()">Todos</button>'+cats.map(c=>`<button class="btn" onclick="category='${c}';load()">${c}</button>`).join("");
document.getElementById("catSelect").innerHTML=cats.map(c=>`<option>${c}</option>`).join("");
async function load(){let d=await api("/api/listings?q="+encodeURIComponent(document.getElementById("q").value)+"&category="+encodeURIComponent(category));document.getElementById("heading").textContent=`${d.length} anúncio${d.length==1?"":"s"}`;document.getElementById("grid").innerHTML=d.map(p=>`<article class="card"><div class="img">${p.image_url?`<img src="${p.image_url}">`:"📦"}</div><div class="pad"><div class="price">${money(p.price)}</div><b>${esc(p.title)}</b><p class="muted">📍 ${esc(p.location)} · ${esc(p.category)}</p><button class="btn primary" onclick="detail(${p.id})">Ver anúncio</button> <button class="btn" onclick="fav(${p.id})">♡</button></div></article>`).join("")}
async function detail(id){let p=await api("/api/listings/"+id);alert(`${p.title}\n\n${p.description}\n\n${money(p.price)}\nLocal: ${p.location}\nVendedor: ${p.seller}\nContacto: ${p.seller_phone||"não informado"}`)}
async function fav(id){if(!token)return openAuth();try{await api("/api/favorites/"+id,{method:"POST"});alert("Adicionado aos favoritos.")}catch(e){alert(e.message)}}
document.getElementById("authForm").onsubmit=async e=>{e.preventDefault();let reg=document.getElementById("name").style.display!=="none";let body={email:email.value,password:password.value};if(reg)Object.assign(body,{name:name.value,phone:phone.value,location:location.value});try{let d=await api(reg?"/api/register":"/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});token=d.token;localStorage.token=token;closeAll();alert("Conta pronta.");}catch(x){document.getElementById("authMsg").textContent=x.message}}
document.getElementById("sellForm").onsubmit=async e=>{e.preventDefault();try{let r=await fetch("/api/listings",{method:"POST",headers:{Authorization:"Bearer "+token},body:new FormData(e.target)}),d=await r.json();if(!r.ok)throw Error(d.error);closeAll();e.target.reset();load();alert("Anúncio publicado!")}catch(x){document.getElementById("sellMsg").textContent=x.message}}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}load();
</script></body></html>
